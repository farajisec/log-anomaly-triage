name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov=triage --cov-report=term-missing
      - name: end-to-end, strict, seed 42
        run: triage --build build all --seed 42 --strict --max-fp 15
      - name: end-to-end, strict, seed 9
        run: triage --build build9 all --seed 9 --strict --max-fp 15
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: evaluation-report
          path: |
            build/report.md
            build/report.html
            build/queue.json
