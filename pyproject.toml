[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-anomaly-triage"
version = "2.0.0"
description = "Unsupervised multi-signal anomaly detection for service metrics with an advisory, explainable, feedback-calibrated triage queue"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Reza Faraji"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "ruff", "mypy"]

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731", "SIM108", "B023"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
"src/triage/report.py" = ["E501"]
